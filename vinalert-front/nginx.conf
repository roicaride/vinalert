server {
    listen 80;
    server_name _;
    client_max_body_size 20m;   # Excels de Dualex

    # IP real del cliente. Delante de nginx solo hay saltos de confianza
    # (túnel de Cloudflare/Tailscale o la red de Docker), todos en rangos
    # privados: se descartan y queda la primera IP pública. Los limites de
    # login del backend van por IP; sin esto todo el mundo compartiria una.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;   # Tailscale
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # API -> contenedor backend (se quita el prefijo /api)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Una sola IP, ya resuelta: no se reenvia lo que mande el cliente.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA con BrowserRouter: cualquier otra ruta devuelve index.html
    # (incluidos los enlaces de invitacion y recuperacion de los correos)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
