# Viñalert en un único servidor. El mismo fichero sirve para producción y
# preproducción: cada entorno vive en su carpeta con su propio .env.
#   docker compose up -d --build                    -> db + backend + web
#   docker compose --profile tunnel up -d --build   -> además, Cloudflare Tunnel
#
# COMPOSE_PROJECT_NAME (en .env) separa los entornos: contenedores, red y
# volumen de la BD llevan ese prefijo (vinalert_pgdata, vinalert-pre_pgdata),
# así que levantar o reconstruir uno no toca el otro.
name: ${COMPOSE_PROJECT_NAME:-vinalert}

# Docker no limita los logs por defecto: en un portátil encendido meses
# acabarían llenando el disco. 3 ficheros de 10 MB por contenedor.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Misma versión mayor que la BD de origen (18): un dump de la 18 no se
    # restaura en una versión anterior.
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vinalert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?pon POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-vinalert}
      TZ: Europe/Madrid
    volumes:
      # Desde la imagen 18 los datos van en /var/lib/postgresql/18/docker y el
      # volumen se monta en /var/lib/postgresql (montarlo en .../data falla).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      # Sobrescribe el DATABASE_URL del .env: dentro de Docker la BD se llama "db"
      DATABASE_URL: postgresql://${POSTGRES_USER:-vinalert}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vinalert}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./vinalert-front
    restart: unless-stopped
    logging: *logging
    ports:
      # Producción en el 80, preproducción en el 8080 (WEB_PORT en .env).
      # Acceso desde la red local: http://IP-del-PC:WEB_PORT
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    logging: *logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  pgdata:
